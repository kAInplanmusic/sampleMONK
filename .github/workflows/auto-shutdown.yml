name: "⏸️ Auto-Shutdown Idle Resources"

# Runs every 30 minutes and shuts down any GCP resources that are not actively needed.
# Also provides a manual trigger for an emergency "stop everything" button.
on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:
    inputs:
      force_shutdown:
        description: "Erzwinge sofortiges Herunterfahren aller Ressourcen"
        required: false
        default: "false"
        type: choice
        options:
          - "false"
          - "true"

jobs:
  shutdown-idle-resources:
    name: "Stop idle GCP resources"
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: "🔐 Authenticate to Google Cloud"
        uses: google-github-actions/auth@v2
        with:
          credentials_json: "${{ secrets.GCP_SA_KEY }}"

      - name: "☁️ Set up Cloud SDK"
        uses: google-github-actions/setup-gcloud@v2

      - name: "🔍 Detect idle GCE VMs and stop them"
        run: |
          PROJECT=$(gcloud config get-value project)
          echo "=== Checking GCE instances in project: $PROJECT ==="

          RUNNING_VMS=$(gcloud compute instances list \
            --project="$PROJECT" \
            --filter="status=RUNNING" \
            --format="table(name,zone,status,lastStartTimestamp)" 2>/dev/null || echo "")

          if [[ -z "$RUNNING_VMS" || "$RUNNING_VMS" == *"Listed 0 items"* ]]; then
            echo "✅ No running GCE VMs found."
          else
            echo "$RUNNING_VMS"
            echo ""
            echo "🛑 Stopping all running GCE VMs (idle policy: shut down after 30 min)..."

            gcloud compute instances list \
              --project="$PROJECT" \
              --filter="status=RUNNING" \
              --format="value(name,zone)" | while read -r name zone; do
                echo "  Stopping VM: $name (zone: $zone)"
                gcloud compute instances stop "$name" \
                  --zone="$zone" \
                  --project="$PROJECT" \
                  --quiet || echo "  ⚠️  Could not stop $name"
            done
            echo "✅ All running VMs stopped."
          fi

      - name: "☁️ Verify Cloud Run services scale to zero"
        run: |
          PROJECT=$(gcloud config get-value project)
          REGION=$(gcloud config get-value compute/region 2>/dev/null || echo "europe-west1")
          echo "=== Cloud Run services in $REGION ==="

          SERVICES=$(gcloud run services list \
            --project="$PROJECT" \
            --region="$REGION" \
            --format="table(metadata.name,status.conditions[0].status,status.url)" 2>/dev/null || echo "")

          if [[ -z "$SERVICES" ]]; then
            echo "No Cloud Run services found."
          else
            echo "$SERVICES"
            echo ""
            echo "ℹ️  Cloud Run services use min-instances=0 and will scale to zero automatically when idle."
          fi

      - name: "🐚 Stop idle Cloud Shell sessions"
        continue-on-error: true
        run: |
          PROJECT=$(gcloud config get-value project)
          echo "=== Checking Cloud Shell environments ==="

          ENVS=$(gcloud cloud-shell environments list \
            --project="$PROJECT" \
            --format="value(name,state)" 2>/dev/null || echo "")

          if [[ -z "$ENVS" ]]; then
            echo "✅ No active Cloud Shell environments found."
          else
            echo "$ENVS"
            # Cloud Shell auto-suspends after ~20 min of inactivity on GCP side,
            # but we log what we see for visibility.
            echo "ℹ️  Cloud Shell environments listed above. They auto-suspend when idle."
          fi

      - name: "📊 Cost summary"
        run: |
          PROJECT=$(gcloud config get-value project)
          echo "=== Resource summary for $PROJECT ==="
          echo ""

          echo "--- GCE VMs ---"
          gcloud compute instances list --project="$PROJECT" \
            --format="table(name,zone,status)" 2>/dev/null || echo "(none)"

          echo ""
          echo "--- Cloud Run Services ---"
          gcloud run services list --project="$PROJECT" \
            --format="table(metadata.name,metadata.namespace,status.url)" 2>/dev/null || echo "(none)"

          echo ""
          echo "--- Cloud Run Jobs ---"
          gcloud run jobs list --project="$PROJECT" \
            --format="table(metadata.name,status.conditions[0].status)" 2>/dev/null || echo "(none)"

          echo ""
          echo "✅ Auto-shutdown check complete. All billable compute resources verified."
